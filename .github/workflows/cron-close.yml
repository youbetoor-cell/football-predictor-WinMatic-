name: cron-close

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-close
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron snapshots (close capture)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          # Debug (safe): show whether secrets are present (values stay masked)
          echo "BASE_URL is set? $([ -n "${BASE_URL:-}" ] && echo yes || echo no)"
          echo "ADMIN_TOKEN length: ${#ADMIN_TOKEN}"

          # Call endpoint and capture HTTP code + body
          endpoint="${BASE_URL%/}/cron/snapshots"
          http_code="$(curl -sS --max-time 120 \
            -o resp.json \
            -w "%{http_code}" \
            --get "$endpoint" \
            --data-urlencode "admin_token=${ADMIN_TOKEN}" \
            --data-urlencode "days_ahead=1" \
            --data-urlencode "odds_limit=10" \
            --data-urlencode "close_snapshot_minutes=180")"

          echo "HTTP: $http_code"
          echo "Body:"
          cat resp.json
          echo

          # Fail fast if not 200
          if [ "$http_code" != "200" ]; then
            echo "Non-200 response from server"
            exit 1
          fi

          # Parse JSON and warn (but don't fail) if some leagues fail
          python3 - <<'PY' < resp.json
          import json, sys
          o = json.load(sys.stdin)
          results = o.get("results", []) or []
          bad = [r for r in results if not r.get("ok")]

          if bad:
              print("WARNING: some leagues failed:")
              for r in bad[:10]:
                  print(" -", r)
              # Only hard-fail if ALL failed (keeps your schedule mostly green)
              if len(bad) == len(results) and results:
                  raise SystemExit("All leagues failed")
          print("OK. leagues:", o.get("leagues"), "results:", len(results), "bad:", len(bad))
          PY
