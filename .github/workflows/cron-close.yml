name: Cron - Close snapshots

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-close
  cancel-in-progress: true

jobs:
  close_snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Call /cron/snapshots (close snapshots)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          url="${BASE_URL}/cron/snapshots?admin_token=${ADMIN_TOKEN}&days_ahead=1&odds_limit=0&close_snapshot_minutes=180"
          echo "Calling: $url"
          resp="$(curl -fsS --max-time 180 "$url")"
          echo "Body:"
          echo "$resp"

          python3 -c '
import sys, json
o=json.load(sys.stdin)
results=o.get("results") or []
bad=[r for r in results if not r.get("ok")]
if not bad:
    print("All leagues OK:", o.get("leagues"))
    raise SystemExit(0)

pats=("quota exhausted","daily request limit","reached the request limit for the day","too many requests","ratelimit")
def is_quota(msg):
    s=(msg or "").lower()
    return any(p in s for p in pats)

other=[r for r in bad if not is_quota(r.get("error",""))]
if other:
    raise SystemExit("Non-quota failures: "+str(other[:3]))

print("Quota/rate-limit reached; not failing workflow. Examples:", bad[:2])
raise SystemExit(0)
' <<<"$resp"
