name: cron-close

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes
  workflow_dispatch: {}

concurrency:
  group: cron-close
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Call cron snapshots (close capture)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          echo "BASE_URL is set? $([[ -n "${BASE_URL:-}" ]] && echo yes || echo no)"
          echo "ADMIN_TOKEN length: ${#ADMIN_TOKEN}"

          url="${BASE_URL}/cron/snapshots"
          echo "Calling: $url"

          resp="$(
            curl -sS --max-time 120 \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --get "$url" \
              --data-urlencode "admin_token=${ADMIN_TOKEN}" \
              --data-urlencode "days_ahead=1" \
              --data-urlencode "odds_limit=10" \
              --data-urlencode "close_snapshot_minutes=180"
          )"

          echo "Body:"
          echo "$resp"

          echo "$resp" | python3 - <<'PY'
          import sys, json
          o = json.load(sys.stdin)

          bad = [r for r in o.get("results", []) if not r.get("ok")]
          if bad:
              raise SystemExit("Some leagues failed: " + str(bad[:3]) + (" ..." if len(bad) > 3 else ""))

          print("OK. leagues:", o.get("leagues"), "results:", len(o.get("results", [])))
          PY
