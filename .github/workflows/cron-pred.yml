name: Cron - Pred snapshots

on:
  schedule:
    # Every 3 hours (adjust as you like)
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-pred
  cancel-in-progress: true

jobs:
  pred_snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Call /cron/snapshots (pred capture)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          # Keep odds_limit modest to reduce API load. Increase if your plan supports it.
          url="${BASE_URL}/cron/snapshots?admin_token=${ADMIN_TOKEN}&days_ahead=7&odds_limit=10"
          echo "Calling: $url"

          resp="$(curl -fsS --max-time 180 "$url")"
          echo "Body:"
          echo "$resp"

          echo "$resp" | python3 - <<'PY'
          import sys, json, re
          o = json.load(sys.stdin)
          results = o.get("results", []) or []
          bad = [r for r in results if not r.get("ok")]
          if not bad:
              print("All leagues OK:", o.get("leagues"))
              raise SystemExit(0)

          quota_patterns = [
              r"quota exhausted",
              r"daily request limit",
              r"reached the request limit for the day",
              r"Too many requests",
              r"rateLimit",
              r"exceeded the limit",
          ]
          def is_quota_err(msg: str) -> bool:
              msg = (msg or "").lower()
              return any(re.search(p.lower(), msg) for p in quota_patterns)

          quota_bad = [r for r in bad if is_quota_err(r.get("error",""))]
          other_bad = [r for r in bad if r not in quota_bad]

          if other_bad:
              raise SystemExit("Non-quota failures: " + str(other_bad[:3]))

          print("Quota/rate-limit reached; not failing workflow. Examples:", quota_bad[:2])
          raise SystemExit(0)
          PY
