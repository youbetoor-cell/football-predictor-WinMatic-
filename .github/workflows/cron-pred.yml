name: cron-pred

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-pred
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron snapshots (pred capture)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          echo "BASE_URL is set? $([ -n "${BASE_URL:-}" ] && echo yes || echo no)"
          echo "ADMIN_TOKEN length: ${#ADMIN_TOKEN}"

          endpoint="${BASE_URL%/}/cron/snapshots"
          http_code="$(curl -sS --max-time 180 \
            -o resp.json \
            -w "%{http_code}" \
            --get "$endpoint" \
            --data-urlencode "admin_token=${ADMIN_TOKEN}" \
            --data-urlencode "days_ahead=7" \
            --data-urlencode "odds_limit=25")"

          echo "HTTP: $http_code"
          echo "Body:"
          cat resp.json
          echo

          if [ "$http_code" != "200" ]; then
            echo "Non-200 response from server"
            exit 1
          fi

          python3 - <<'PY' < resp.json
          import json, sys
          o = json.load(sys.stdin)
          results = o.get("results", []) or []
          bad = [r for r in results if not r.get("ok")]

          if bad:
              print("WARNING: some leagues failed:")
              for r in bad[:10]:
                  print(" -", r)
              if len(bad) == len(results) and results:
                  raise SystemExit("All leagues failed")
          print("OK. leagues:", o.get("leagues"), "results:", len(results), "bad:", len(bad))
          PY

          if bad:
              raise SystemExit("Some leagues failed: " + str(bad[:3]) + (" ..." if len(bad)>3 else ""))
          print("OK. leagues:", o.get("leagues"), "results:", len(o.get("results",[])))
          PY
